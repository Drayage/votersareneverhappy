name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/city-builder-game-design-450p51
      - main
  workflow_dispatch:

# gh-pages 브랜치에 푸시하기 위한 권한
permissions:
  contents: write

concurrency:
  group: pages-ghbranch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 빌드 결과(dist)를 gh-pages 브랜치로 강제 푸시한다.
      # .nojekyll 로 Jekyll 처리를 끄고(Vite 에셋 보호), Pages Source = gh-pages 가 이를 서빙.
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
